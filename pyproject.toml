[project]
name = "prostate-train"
version = "0.1.0"
description = "A standalone script for downloading the Prostate158 dataset."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "zenodo-get==3.0.3",
  "monai[all]==1.5.2",
  "nnunetv2==2.7.0",
  "nibabel==5.4.2",
  "SimpleITK==2.5.5",
  "pydicom==3.0.2",
  "pandas==2.3.3",
  "matplotlib==3.10.9",
  "torchmetrics==1.9.0",
  "einops==0.8.2",
  "wandb==0.27.1",
  "ipykernel==7.2.0",
  "ipywidgets==8.1.8",
  "pingouin==0.6.1",
  "tcia-utils==3.3.2",
  "idc-index==0.12.3",
  # pydicom-seg 0.4.1 imports pydicom._storage_sopclass_uids which was removed
  # in pydicom 3.x. Two files were patched manually in the venv with a try/except
  # fallback to pydicom.uid:
  #   .venv/lib/python3.12/site-packages/pydicom_seg/reader.py
  #   .venv/lib/python3.12/site-packages/pydicom_seg/segmentation_dataset.py
  # If you reinstall, re-apply the patch to both files:
  #   s/from pydicom._storage_sopclass_uids import SegmentationStorage/
  #   try:\n    from pydicom._storage_sopclass_uids import SegmentationStorage\n  except ImportError:\n    from pydicom.uid import SegmentationStorage
  "pydicom-seg>=0.4.1",
]

[tool.uv]
override-dependencies = ["pandas==2.3.3"]
package = false
python-downloads = "automatic"
python-preference = "only-managed"
