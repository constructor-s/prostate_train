[project]
name = "prostate-train"
version = "0.1.0"
description = "A standalone script for downloading the Prostate158 dataset."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "zenodo-get==3.0.3",
  "monai[all]==1.5.2",
  "nnunetv2==2.7.0",
  "nibabel==5.4.2",
  "SimpleITK==2.5.5",
  "pydicom==3.0.2",
  "pandas==2.3.3",
  "matplotlib==3.10.9",
  "torchmetrics==1.9.0",
  "einops==0.8.2",
  "wandb==0.27.1",
  "ipykernel==7.2.0",
  "ipywidgets==8.1.8",
]

[tool.uv]
package = false
python-downloads = "automatic"
python-preference = "only-managed"
